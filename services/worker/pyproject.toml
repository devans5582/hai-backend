[project]
name = "hai-worker"
version = "0.1.0"
description = "HAI background worker"
requires-python = ">=3.11"
dependencies = [
    "hai-ontology",
    "hai-core",
    "hai-pipeline",
    "hai-engine",
]
[project.scripts]
hai-worker = "hai_worker.main:main"

[tool.uv.sources]
hai-ontology = { workspace = true }
hai-core = { workspace = true }
hai-pipeline = { workspace = true }
hai-engine = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hai_worker"]
