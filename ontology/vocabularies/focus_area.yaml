vocabulary:
  code: focus_area
  title: Focus area
  description: "The seven areas Humaital asked the methodology to look at more closely (change request 2026-11-09). A criterion lists the areas it bears on; a link may be tagged with the one area its quote speaks to. evidence_basis is cross-cutting: it is applied by the scoring to every criterion rather than mapped to criteria. Coverage per area is reported; the areas do not change weights."
  attributes: { question: string, cross_cutting: boolean }
  values:
    - { code: control_verification, label: Verification of AI controls, description: "Beyond documented policies: independent verification that safety controls work, including the ability to pause, shut down or roll back an AI system.", attributes: { question: "Do the controls demonstrably work, and can the organization stop or reverse its AI systems?", cross_cutting: false } }
    - { code: autonomous_monitoring, label: Autonomous AI monitoring, description: "How the organization monitors AI agents acting independently: their decisions, actions and ability to operate outside intended boundaries.", attributes: { question: "Are autonomous decisions and actions observed, and are boundary violations detected?", cross_cutting: false } }
    - { code: containment_security, label: Containment and security testing, description: "Whether AI systems can bypass restrictions, access unauthorized resources, escalate privileges or disable safeguards, and whether that is tested.", attributes: { question: "Has anyone tried to break out, and what happened?", cross_cutting: false } }
    - { code: evidence_basis, label: Evidence-based scoring, description: "Scoring that distinguishes stated commitments, documented controls, actual testing and independent verification. Applied to every criterion through the maturity ladder.", attributes: { question: "Is this a statement, a documented control, a test result or an independent verification?", cross_cutting: true } }
    - { code: incident_response, label: Incident response and recovery, description: "How quickly the organization identifies, discloses, contains and corrects AI failures, and whether corrective actions are verified to work.", attributes: { question: "How fast was the failure found, disclosed, contained and fixed, and did the fix work?", cross_cutting: false } }
    - { code: independent_auditability, label: Independent monitoring and auditability, description: "AI behavior that can be independently observed and recorded, rather than relying on the system's own explanations of its actions.", attributes: { question: "Could someone other than the AI system itself see what it did?", cross_cutting: false } }
    - { code: human_benefit, label: Human benefit and measurable impact, description: "The distinction between a stated intention to benefit humanity and measurable evidence that AI applications improve people's lives.", attributes: { question: "Is the benefit stated, counted, measured in people's lives, or independently evaluated?", cross_cutting: false } }
