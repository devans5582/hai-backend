vocabulary:
  code: evidence_class
  title: Evidence class
  description: "Kind of evidence (spec 7.8, decision D9). multiplier is the Phase 6 evidence type multiplier (legacy evidence-weighting.js:122-126); foundational_governance shares the governance value as a draft."
  attributes: { multiplier: number, content_status: string }
  values:
    - { code: foundational_governance, label: Foundational governance, description: "Published methodology, principles or framework that frames the organization's governance.", attributes: { multiplier: 0.7, content_status: draft } }
    - { code: core_governance, label: Core governance, description: "Policy, statement or commitment. Intent without execution proof.", attributes: { multiplier: 0.7, content_status: draft } }
    - { code: operational_evidence, label: Operational evidence, description: "Process, control, metric or dated record. Execution evidence.", attributes: { multiplier: 1.0, content_status: draft } }
    - { code: external_validation, label: External validation, description: "Independent audit, certification or regulatory filing.", attributes: { multiplier: 1.3, content_status: draft } }
