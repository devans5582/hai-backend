# Framework crosswalks: which external framework clauses each HAI criterion relates to.
# DRAFT. content_status: draft. TODO(humaital): confirm every mapping with the methodology owners
# before the methodology version is marked approved. Nothing here affects scoring; the mappings are
# read by the report generator for the "related frameworks" section only when status is approved.
# Clause identifiers follow the public numbering of each framework. Direction describes how the HAI
# criterion relates to the clause: covers (the criterion asks for the same control), supports (partial
# overlap) or informs (context only).
crosswalks:
