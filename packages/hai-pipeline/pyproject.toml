[project]
name = "hai-pipeline"
version = "0.1.0"
description = "HAI pipeline: connectors, entity resolution, extraction, spans, clustering, linking, admissibility, incidents, snapshot"
requires-python = ">=3.11"
dependencies = [
    "hai-ontology",
    "hai-core",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pypdf>=5.0",
]
[tool.uv.sources]
hai-ontology = { workspace = true }
hai-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hai_pipeline"]
