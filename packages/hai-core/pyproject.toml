[project]
name = "hai-core"
version = "0.1.0"
description = "HAI core: settings, database, typed store, audit chain, job queue, blob store, freshness, auth"
requires-python = ">=3.11"
dependencies = [
    "hai-ontology",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "PyJWT>=2.9",
    "fsspec>=2024.10",
]
[project.scripts]
hai-db = "hai_core.cli:main"

[tool.uv.sources]
hai-ontology = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hai_core"]
