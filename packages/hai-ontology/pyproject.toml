[project]
name = "hai-ontology"
version = "0.1.0"
description = "HAI ontology: meta-model, loader, validator, versioning, code generators, CLI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]
[project.scripts]
hai-ontology = "hai_ontology.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hai_ontology"]
