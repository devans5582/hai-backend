[project]
name = "hai-engine"
version = "0.1.0"
description = "HAI engine: classification, evidence packs, LLM providers, validator, rules, scoring, decisions, certification, reports"
requires-python = ">=3.11"
dependencies = [
    "hai-ontology",
    "hai-core",
    "httpx>=0.27",
    "jsonschema>=4.23",
]
[tool.uv.sources]
hai-ontology = { workspace = true }
hai-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hai_engine"]
